[graph]
all-features = false
no-default-features = false

[advisories]
ignore = []

[licenses]
allow = [
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
]
exceptions = []

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "deny"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
  { crate = "syn@1.0.109", reason = "non-empty-string 0.2.6 depends on delegate, whose proc macro still uses syn 1; no newer non-empty-string release is available" },
  { crate = "getrandom@0.2.17", reason = "ring 0.17 via rustls still depends on getrandom 0.2 while custode and current dev tooling use getrandom 0.3" },
  { crate = "windows-sys@0.52.0", reason = "ring 0.17 depends on this Windows support crate while current CLI/runtime dependencies use windows-sys 0.61" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
