[package]
name = "custode-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
custode = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "accepted_path_set_path"
path = "fuzz_targets/accepted_path_set_path.rs"
test = false
doc = false
bench = false

[[bin]]
name = "allowed_operation_parse"
path = "fuzz_targets/allowed_operation_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "upstream_origin_parse"
path = "fuzz_targets/upstream_origin_parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
