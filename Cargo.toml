[package]
name = "custode"
description = "A contained harness provider gateway for untrusted agent runtimes."
version = "0.1.0"
authors = ["Dan Kubb <github@dan.kubb.ca>"]
edition = "2024"
publish = false
license = "MIT"
categories = ["command-line-utilities", "development-tools"]
keywords = ["agent", "docker", "gateway", "proxy", "security"]

[[bin]]
name = "custode-proxy"
path = "src/main.rs"

[lints]
workspace = true

[workspace]
members = ["."]
resolver = "3"

[workspace.package]
authors = ["Dan Kubb <github@dan.kubb.ca>"]
edition = "2024"
publish = false
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"
future_incompatible = { level = "deny", priority = -1 }
missing_docs = "deny"
let_underscore_drop = "deny"
unreachable_pub = "deny"
unused = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"
missing_copy_implementations = "deny"
unexpected_cfgs = { level = "deny", check-cfg = [
  "cfg(coverage)",
  "cfg(coverage_nightly)",
] }
unfulfilled_lint_expectations = "deny"
unused_crate_dependencies = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction = { level = "deny", priority = -1 }

allow_attributes = "deny"
allow_attributes_without_reason = "deny"
exhaustive_enums = "allow"
expect_used = "allow"
implicit_return = "allow"
inline_modules = "allow"
multiple_crate_versions = "allow"
pub_with_shorthand = "allow"
pub_use = "allow"
question_mark_used = "allow"
separated_literal_suffix = "allow"
single_call_fn = "allow"
std_instead_of_alloc = "allow"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
missing_crate_level_docs = "deny"
private_doc_tests = "deny"
unescaped_backticks = "deny"

[dependencies]
axum = "0.8"
blake3 = "1.8.5"
clap = { version = "4.6.1", features = ["derive", "env"] }
futures-util = "0.3"
http = "1.3.1"
http-body-util = "0.1"
humantime = "2.3.0"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3"
tower = "0.5"
